# Release: tag vX.Y.Z → full CI → signed images → staging (automatic) → production (manual approval).
# Repository setup (docs/release-checklist.md): environments "staging" and "production" (production with
# required reviewers), secrets KUBECONFIG (per environment) and vars APP_URL (per environment).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing with cosign
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build, push and sign (with SBOM and provenance)
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          build() { # name dockerfile [target]
            ref="$REGISTRY/orbit-$1"
            docker buildx build --push --sbom=true --provenance=mode=max \
              -f "$2" ${3:+--target "$3"} -t "$ref:$VERSION" -t "$ref:sha-${GITHUB_SHA::12}" \
              --metadata-file "/tmp/$1.json" .
            digest=$(jq -r '."containerimage.digest"' "/tmp/$1.json")
            cosign sign --yes "$ref@$digest"
          }
          for target in api worker migrate ops; do build "$target" infrastructure/docker/api.Dockerfile "$target"; done
          build web infrastructure/docker/web.Dockerfile

  deploy-staging:
    needs: [images]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.images.outputs.version }}
        run: ./infrastructure/scripts/deploy.sh staging
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.APP_URL }}/api/v1/health/ready"

  deploy-production:
    needs: [images, deploy-staging]
    runs-on: ubuntu-24.04
    environment: production    # required reviewers approve here
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy (backup → migrate → roll out → smoke test; rolls back on failure)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.images.outputs.version }}
          APP_URL: ${{ vars.APP_URL }}
        run: ./infrastructure/scripts/deploy.sh production
