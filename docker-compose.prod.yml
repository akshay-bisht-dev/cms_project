# Production on a single host (docs/deployment-guide.md). Images come from the registry, never built here.
#   export ORBIT_REGISTRY=ghcr.io/acme/orbit ORBIT_VERSION=1.0.0 ORBIT_DOMAIN=orbit.example.com
#   docker compose -f docker-compose.prod.yml --profile release run --rm migrate   # each release, after a verified backup
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml --profile ops run --rm backup          # from a systemd timer / cron
# Configuration and secrets live in /etc/orbit/*.env (root-owned, mode 0600), never in this repository.
# Recommended: managed MySQL 8.4 and Redis 7 (set their URLs in orbit.env). The "selfhosted" profile runs
# both here instead, on the internal network only.
name: orbit

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  env_file: [/etc/orbit/orbit.env]

services:
  nginx:
    <<: *hardening
    image: nginx:1.28-alpine
    # Binds 80/443 and writes its PID and caches, so it keeps these capabilities and writable paths.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    tmpfs: ["/tmp:size=64m", "/var/cache/nginx:size=64m", "/var/run:size=1m", "/etc/nginx/conf.d:size=1m"]
    ports: ["80:80", "443:443"]
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?set ORBIT_DOMAIN}
    volumes:
      - ./infrastructure/nginx/production/orbit.conf.template:/etc/nginx/templates/orbit.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { memory: 256m } }

  web:
    <<: *hardening
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-web:${ORBIT_VERSION:?set ORBIT_VERSION}
    env_file: [/etc/orbit/web.env]
    environment:
      API_INTERNAL_URL: http://api:4000
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      replicas: 2
      resources: { limits: { memory: 512m } }

  api:
    <<: [*hardening, *app-env]
    image: ${ORBIT_REGISTRY}/orbit-api:${ORBIT_VERSION}
    environment:
      ORBIT_SERVICE: api
      METRICS_PORT: "9464"
    networks: [frontend, backend]
    # Built-in HEALTHCHECK (liveness); readiness is /api/v1/health/ready behind Nginx.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/v1/health/live"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    stop_grace_period: 30s
    deploy:
      replicas: 2
      resources: { limits: { memory: 768m } }

  worker:
    <<: [*hardening, *app-env]
    image: ${ORBIT_REGISTRY}/orbit-worker:${ORBIT_VERSION}
    environment:
      ORBIT_SERVICE: worker
      METRICS_PORT: "9464"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9464/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Running jobs finish before exit (BullMQ Worker.close waits for them).
    stop_grace_period: 120s
    deploy:
      replicas: 1
      resources: { limits: { memory: 1g } }

  # --- release ---------------------------------------------------------------------------------
  migrate:
    <<: *hardening
    profiles: [release]
    restart: "no"
    image: ${ORBIT_REGISTRY}/orbit-migrate:${ORBIT_VERSION}
    # Migration user (DDL), separate from the app user; only this job receives it.
    env_file: [/etc/orbit/migrate.env]
    networks: [frontend, backend]

  # --- operations jobs (run from host timers; see docs/operations.md) -------------------------------
  backup:
    <<: *hardening
    profiles: [ops]
    restart: "no"
    image: ${ORBIT_REGISTRY}/orbit-ops:${ORBIT_VERSION}
    env_file: [/etc/orbit/ops.env]
    # Host directory owned by uid 999 (the image's mysql user); restore-verify reads the same files.
    volumes: ["/var/backups/orbit:/app/backups"]
    command: ["node", "scripts/backup/backup.js"]
    networks: [frontend, backend]

  restore-verify:
    <<: *hardening
    profiles: [ops]
    restart: "no"
    image: ${ORBIT_REGISTRY}/orbit-ops:${ORBIT_VERSION}
    env_file: [/etc/orbit/ops.env]
    volumes: ["/var/backups/orbit:/app/backups"]
    command: ["node", "scripts/backup/restore-verify.js"]
    networks: [frontend, backend]

  partition-maintenance:
    <<: *hardening
    profiles: [ops]
    restart: "no"
    image: ${ORBIT_REGISTRY}/orbit-ops:${ORBIT_VERSION}
    env_file: [/etc/orbit/ops.env]
    command: ["node", "scripts/partition-maintenance.js"]
    networks: [frontend, backend]

  # --- optional self-hosted data stores (prefer managed services) -------------------------------------
  mysql:
    profiles: [selfhosted]
    image: mysql:8.4
    restart: unless-stopped
    env_file: [/etc/orbit/mysql.env]
    # Migrations create triggers; binary logs (7 days) give point-in-time recovery between backups.
    command: ["--log-bin-trust-function-creators=1", "--binlog-expire-logs-seconds=604800"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/my.cnf:/etc/mysql/conf.d/orbit.cnf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources: { limits: { memory: 4g } }

  redis:
    profiles: [selfhosted]
    image: redis:7.4-alpine
    restart: unless-stopped
    # requirepass comes from the env file; AOF so queued jobs survive a restart.
    env_file: [/etc/orbit/redis.env]
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    volumes: [redis-data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources: { limits: { memory: 1g } }

networks:
  # Nginx, web, API, worker and jobs: a normal bridge (egress to managed databases, object storage,
  # SMTP and webhook receivers). Only Nginx publishes ports.
  frontend: {}
  # Self-hosted MySQL and Redis: reachable from the app tier only, with no route out.
  backend:
    internal: true

volumes:
  mysql-data:
  redis-data:
