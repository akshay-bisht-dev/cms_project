# Base manifests (docs/deployment-guide.md §Kubernetes). Apply an overlay, not this directory:
#   kubectl apply -k infrastructure/k8s/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbit
labels:
  - pairs: { app.kubernetes.io/part-of: orbit }
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  - network-policy.yaml
  - ops-cronjobs.yaml
