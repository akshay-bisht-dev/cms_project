# EXAMPLE ONLY — never commit real values, and never apply this file as is. Create these Secrets with
# your secret manager (External Secrets Operator, Sealed Secrets, Vault, …). Keys are documented in
# docs/environment.md. Each job gets only the credentials it needs.
apiVersion: v1
kind: Secret
metadata: { name: orbit-secrets, namespace: orbit }
type: Opaque
stringData:
  APP_ORIGIN: https://orbit.example.com
  DATABASE_URL: mysql://orbit_app:REPLACE@mysql.internal:3306/orbit?sslaccept=strict
  REDIS_URL: rediss://:REPLACE@redis.internal:6380
  S3_ACCESS_KEY_ID: REPLACE
  S3_SECRET_ACCESS_KEY: REPLACE
  S3_BUCKET_CAPTURES: orbit-captures
  S3_BUCKET_FILES: orbit-files
  SESSION_SECRET: REPLACE-48-random-bytes
  CSRF_SECRET: REPLACE-48-random-bytes
  FIELD_ENCRYPTION_KEYS: k1:REPLACE-base64-32-bytes
  SMTP_HOST: smtp.example.com
  SMTP_USER: REPLACE
  SMTP_PASSWORD: REPLACE
  SMTP_FROM: Orbit <no-reply@example.com>
---
apiVersion: v1
kind: Secret
metadata: { name: orbit-migrate, namespace: orbit }
type: Opaque
stringData:
  DATABASE_URL: mysql://orbit_migrate:REPLACE@mysql.internal:3306/orbit?sslaccept=strict
---
apiVersion: v1
kind: Secret
metadata: { name: orbit-backup, namespace: orbit }
type: Opaque
stringData:
  BACKUP_DATABASE_URL: mysql://orbit_backup:REPLACE@mysql-replica.internal:3306/orbit
  BACKUP_AGE_RECIPIENT: age1REPLACE
  BACKUP_S3_BUCKET: orbit-backups
  S3_ACCESS_KEY_ID: REPLACE-write-only-to-orbit-backups
  S3_SECRET_ACCESS_KEY: REPLACE
---
apiVersion: v1
kind: Secret
metadata: { name: orbit-restore, namespace: orbit }
type: Opaque
stringData:
  RESTORE_ADMIN_URL: mysql://restore_admin:REPLACE@restore-check.internal:3306/mysql
  BACKUP_S3_BUCKET: orbit-backups
  BACKUP_AGE_IDENTITY: /run/secrets/age/identity.txt
  S3_ACCESS_KEY_ID: REPLACE-read-only-on-orbit-backups
  S3_SECRET_ACCESS_KEY: REPLACE
---
apiVersion: v1
kind: Secret
metadata: { name: orbit-maintenance, namespace: orbit }
type: Opaque
stringData:
  DATABASE_MAINTENANCE_URL: mysql://orbit_maintenance:REPLACE@mysql.internal:3306/orbit
  S3_BUCKET_ARCHIVE: orbit-archive
