# Same-origin routing: /api and /socket.io go to Express, everything else to Next.js.
# Local compose serves plain HTTP on :8080; production terminates TLS here or at the load balancer
# (see docs/deployment.md for the TLS server block).

upstream orbit_api { server api:4000; keepalive 32; }
upstream orbit_web { server web:3000; keepalive 32; }

map $http_x_request_id $orbit_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

limit_req_zone $binary_remote_addr zone=orbit_api_ip:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 2m;   # uploads go directly to object storage
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $orbit_request_id;
  proxy_set_header Connection "";

  location /api/ {
    limit_req zone=orbit_api_ip burst=60 nodelay;
    proxy_read_timeout 30s;
    proxy_pass http://orbit_api;
  }

  location /socket.io/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_pass http://orbit_api;
  }

  location / {
    proxy_pass http://orbit_web;
  }
}
