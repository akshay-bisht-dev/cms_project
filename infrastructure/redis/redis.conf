appendonly yes
appendfsync everysec
# BullMQ requires keys never be evicted.
maxmemory-policy noeviction
# Development only. Protected mode accepts loopback connections only, but the API container and the
# host (through Docker's port mapping) never connect from loopback. The host port is bound to
# 127.0.0.1 in docker-compose.yml; production Redis requires a password (docker-compose.prod.yml).
protected-mode no
